name: CI/CD Pipeline

on:
  push:
    branches: [ main, working ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.5
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Build Angular UI ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build Angular UI
        working-directory: ./ui
        run: ng build --configuration production

      # ---------- Build Spring Boot ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build Spring Boot app
        working-directory: ./ # adjust if your backend is in a subfolder
        run: ./mvnw clean package -DskipTests

      # ---------- Docker Build & Push ----------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/ecommerce-app:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/ecommerce-app:latest

      # ---------- (Optional) Deploy ----------
      # Add your deployment steps here (e.g., to Kubernetes, ECS, etc.)

  build-angular:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.5
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Build Angular UI ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build Angular UI
        working-directory: ./ui
        run: ng build --configuration production

  build-java:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.5
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Build Spring Boot ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build Spring Boot app
        working-directory: ./ # adjust if your backend is in a subfolder
        run: ./mvnw clean package -DskipTests

  deploy:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.5
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Docker Build & Push ----------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/ecommerce-app:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/ecommerce-app:latest

      # ---------- (Optional) Deploy ----------
      # Add your deployment steps here (e.g., to Kubernetes, ECS, etc.)