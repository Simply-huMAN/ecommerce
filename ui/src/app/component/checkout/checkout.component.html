<div class="container">
    <div *ngIf="product===null" class="error-container">
        <div class="error-container-header">
            <img src="assets/error_24dp.svg" alt="error logo">
            <span>Cannot open this page, please go back</span>
        </div>
        <div class="error-container-footer">
            <button mat-raised-button>Home</button>
            <button mat-raised-button>Shop</button>
        </div>
    </div>

    <div class="product-card-container">
        <div class="product-title-section">
            <span class="product-title">{{product?.productName}}</span>
        </div>

        <div class="product-card-right-section">
            <div class="product-checkout-section">
                <div>
                    <span class="product-text-data">MRP (Incl. of all taxes)</span>
                    <span class="product-text-data">₹{{product?.productPrice}}</span>
                </div>
                <div>
                    <span class="product-text-data">Discount</span>
                    <span class="product-text-data">0</span>
                </div>
                <div>
                    <span class="product-text-data">Final Price</span>
                    <span class="product-text-data">₹{{product?.productPrice}}</span>
                </div>
                <mat-divider></mat-divider>
                <div class="product-checkout-buttons">
                    <button mat-raised-button style="color: var(--mat-blue);">Wishlist</button>
                    <button mat-raised-button color="primary" >Buy</button>
                </div>
            </div>
            <mat-divider></mat-divider>

        </div>
    </div>

</div>
